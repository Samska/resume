name: Generate tailored resume

on:
  workflow_dispatch:
    inputs:
      language:
        description: Resume language
        required: true
        default: en-US
        type: choice
        options:
          - en-US
          - pt-BR
      model:
        description: AI model
        required: true
        default: Automatic (recommended)
        type: choice
        options:
          - Automatic (recommended)
          - OpenAI GPT Mini (balanced)
          - Anthropic Claude Sonnet (high quality)
          - Google Gemini Flash (economical)
          - DeepSeek Chat (economical)
      job_url:
        description: Job URL
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      JOB_URL: ${{ inputs.job_url }}
      TARGET_LANGUAGE: ${{ inputs.language }}
      MODEL_CHOICE: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate master resume source
        run: |
          python3 scripts/tailor_resume.py \
            --source "RESUME_${TARGET_LANGUAGE}.md" \
            --language "$TARGET_LANGUAGE" \
            --validate-source

      - name: Check OpenRouter secret
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "Repository secret OPENROUTER_API_KEY is not configured."
            exit 1
          fi

      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex poppler-utils

      - name: Select OpenRouter model
        run: |
          case "$MODEL_CHOICE" in
            "Automatic (recommended)") model="openrouter/auto" ;;
            "OpenAI GPT Mini (balanced)") model="~openai/gpt-mini-latest" ;;
            "Anthropic Claude Sonnet (high quality)") model="~anthropic/claude-sonnet-latest" ;;
            "Google Gemini Flash (economical)") model="~google/gemini-flash-latest" ;;
            "DeepSeek Chat (economical)") model="deepseek/deepseek-chat" ;;
            *) echo "Unknown model selection: $MODEL_CHOICE"; exit 1 ;;
          esac
          echo "OPENROUTER_MODEL=$model" >> "$GITHUB_ENV"
          echo "Selected model: $MODEL_CHOICE"

      - name: Generate tailored Markdown and match report
        run: |
          python3 scripts/tailor_resume.py \
            --source "RESUME_${TARGET_LANGUAGE}.md" \
            --language "$TARGET_LANGUAGE" \
            --model "$OPENROUTER_MODEL" \
            --manifest "$RUNNER_TEMP/tailored-resume-manifest.json"

      - name: Validate grounded Markdown and report
        run: |
          python3 scripts/validate_tailored_resume.py \
            --mode content \
            --markdown "$TAILORED_MARKDOWN" \
            --source "RESUME_${TARGET_LANGUAGE}.md" \
            --report "$MATCH_REPORT" \
            --manifest "$GROUNDING_MANIFEST" \
            --language "$TARGET_LANGUAGE"

      - name: Generate tailored PDF
        run: |
          pandoc "$TAILORED_MARKDOWN" \
            --pdf-engine=xelatex \
            -V geometry:margin=0.65in \
            -V fontsize=10pt \
            -V header-includes='\usepackage{needspace}\usepackage{etoolbox}\pretocmd{\subsubsection}{\Needspace{10\baselineskip}}{}{}' \
            -o "$TAILORED_PDF"

      - name: Validate tailored PDF
        run: |
          python3 scripts/validate_tailored_resume.py \
            --mode full \
            --pdf "$TAILORED_PDF" \
            --markdown "$TAILORED_MARKDOWN" \
            --source "RESUME_${TARGET_LANGUAGE}.md" \
            --report "$MATCH_REPORT" \
            --manifest "$GROUNDING_MANIFEST" \
            --language "$TARGET_LANGUAGE"

      - name: Verify tailored artifact contents
        run: |
          test -f "$TAILORED_MARKDOWN"
          test -f "$TAILORED_PDF"
          test -f "$MATCH_REPORT"
          artifact_count="$(find "$(dirname "$TAILORED_MARKDOWN")" -maxdepth 1 -type f | wc -l)"
          test "$artifact_count" -eq 3
          case "$GROUNDING_MANIFEST" in
            "$(dirname "$TAILORED_MARKDOWN")"/*) echo "Manifest must remain outside tailored output."; exit 1 ;;
          esac

      - name: Upload tailored resume
        uses: actions/upload-artifact@v4
        with:
          name: tailored-resume-${{ github.run_number }}
          path: |
            ${{ env.TAILORED_MARKDOWN }}
            ${{ env.TAILORED_PDF }}
            ${{ env.MATCH_REPORT }}
          retention-days: 30
          if-no-files-found: error
