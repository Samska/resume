name: Build and validate resume

on:
  pull_request:
    paths:
      - "content/**"
      - "scripts/**"
      - "styles/**"
      - "requirements.txt"
      - ".github/workflows/build-resume.yml"
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "styles/**"
      - "requirements.txt"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core
          python -m pip install --require-hashes -r requirements.lock

      - name: Build resumes
        run: python scripts/build.py

      - name: Validate ATS-readable outputs
        run: python scripts/validate.py

      - name: Upload generated resumes
        uses: actions/upload-artifact@v7
        with:
          name: Samuel-Andrade-Resumes
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit stable outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "chore: update generated resumes [skip ci]"
            git push
          fi
